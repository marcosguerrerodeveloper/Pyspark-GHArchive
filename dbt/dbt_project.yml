name: gharchive
version: "1.0.0"
config-version: 2

profile: gharchive

model-paths: ["models"]
test-paths: ["tests"]
target-path: "target"
clean-targets: ["target", "dbt_packages"]

vars:
  # Ventana analizada (D19 quater). El tramo A y el tramo B se tratan igual
  # aqui; la diferencia de esquema se resolvio en silver.
  fecha_desde: "2025-08-13"
  fecha_hasta: "2026-08-15"

models:
  gharchive:
    staging:
      +materialized: view
    marts:
      # Las dimensiones y hechos se materializan: el dashboard consulta muchas
      # veces y no conviene reescanear el Parquet en cada consulta.
      +materialized: table
